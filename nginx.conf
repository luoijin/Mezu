# Nginx Server Configuration for Mezu - Music Library
# Features: Byte-Range Streaming, Caching & Security Headers

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression for Text-based Resources
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        image/svg+xml;

    # Media Streaming Endpoints (MP3 & MP4) with Byte-Range support
    location ~* \.(mp3|mp4)$ {
        add_header Accept-Ranges bytes;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        tcp_nodelay on;
        sendfile on;
        sendfile_max_chunk 1m;
    }

    # Static Graphic Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Stylesheet and JavaScript Caching
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Font Caching
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Default Fallback Route
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
